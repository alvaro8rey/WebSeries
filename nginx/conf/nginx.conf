worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    server {
        listen 8080;
        server_name _;

        # Página personalizada para 403
        error_page 403 /custom_403.html;
        error_page 404 /custom_404.html;

        location = /custom_403.html {
            root C:/WebSeries/www/errors;  # Carpeta donde guardas tu HTML
            internal;  # Evita acceso directo desde fuera
        }
    
        # Página personalizada para 404

        location = /custom_404.html {
            root C:/WebSeries/www/errors;  # Carpeta donde guardas tu HTML
            internal;  # Evita acceso directo desde fuera
        }

        # ==========================================================
        # API - FIX 405 (QUITAMOS EL ^~ Y LA BARRA PARA MÁXIMA COMPATIBILIDAD)
        # ==========================================================
        # =========================
        # API → FASTAPI (FIX 504)
        # =========================
        location /api/ {
            # Usamos la IP explícita 127.0.0.1 en lugar de localhost
            proxy_pass http://127.0.0.1:9000/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tiempos de espera más cortos para detectar fallos rápido
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ==========================================================
        # HLS STREAMING
        # ==========================================================
        # Para las Series
        location /Series_HLS/ {
            alias "D:/Series_HLS/";  # Usa comillas si hay espacios yasegúrate de la barra final
            autoindex off;
            add_header Access-Control-Allow-Origin *; # Crítico paraque el reproductor web no de error de CORS
            add_header Cache-Control "no-store";

            # Asegurar tipos MIME para HLS
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # Para las Películas
        location /Peliculas_HLS/ {
            alias "D:/Peliculas_HLS/";
            autoindex off;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-store";

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # ==========================================================
        # THUMBNAILS (sprites .webp/.jpg y VTT para previews)
        # ==========================================================
        location ~ ^/(Series_HLS|Peliculas_HLS)/(.+)/thumbnails/(.+\.(vtt|webp|jpg|jpeg|png))$ {
            alias "D:/$1/$2/thumbnails/$3";
            autoindex off;
            expires 30d;                          # Cache largo (son estáticos)
            add_header Access-Control-Allow-Origin *;  # Necesario para el reproductor
            add_header Cache-Control "public, max-age=2592000";

            # Tipos MIME correctos
            types {
                text/vtt                              vtt;
                image/webp                            webp;
                image/jpeg                            jpg jpeg;
                image/png                             png;
            }
        }

        # ==========================================================
        # FRONTEND
        # ==========================================================
        location / {
            root C:/WebSeries/www;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Bloquear descargas directas de archivos pesados
        location ~* \.(mp4|mkv|avi|mov)$ {
            deny all;
        }
    }
}